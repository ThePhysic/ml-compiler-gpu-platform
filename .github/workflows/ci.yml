name: CPU correctness (does not validate GPU execution)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU package and tests
        run: python -m pip install -e '.[test]'
      - name: Validate IR, compiler, reference runtime, simulator, and CLI
        run: python -m pytest -m 'not gpu' -q
