[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlgpu"
version = "0.1.0"
description = "An inspectable tensor compiler, resource-constrained accelerator simulator, and Triton GPU runtime"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpu = ["torch>=2.5", "triton>=3.1; sys_platform == 'linux'"]

[project.scripts]
mlgpu = "mlgpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and Triton"]
